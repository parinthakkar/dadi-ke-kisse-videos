name: Upload Shorts to YouTube

on:
  push:
    branches: [main]
    paths: ["shorts/**", "*.json", "*.mp4"]
  schedule:
    - cron: "17 */6 * * *"   # safety net: retries anything still waiting every 6 hours
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: youtube-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet google-api-python-client==2.151.0 google-auth==2.35.0 requests
      - name: Upload waiting Shorts
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: if [ -f scripts/upload.py ]; then python3 scripts/upload.py; else python3 upload.py; fi
      - name: Save results (YouTube links) back to the repo
        if: always()
        run: |
          git config user.name "dadi-ke-kisse-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Uploaded Shorts to YouTube [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
